      titel: "Icke-uppäten mat på event – Outro",
      medverkande: "Stellan Nordahl\nPatrik\nMia Ehrenstråle\nMonica Fallesen, Moderator, Ship of a New Story/Emprogage",
      kortbeskrivning: "Avslutande samtal om hur vi tar tillvara icke-uppäten mat – vad har vi lärt oss under veckan?",
      utokad: "Outro och summering av veckans arbete kring matsvinn vid stora evenemang. Vilka konkreta steg kan vi ta vidare?" }
  ]}
];

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✓ Kopierat!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
  });
}

function field(label, value, highlight=false) {
  const empty = !value || value.trim() === '';
  const escaped = empty ? '' : value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="field-group">
    <div class="field-label">${label}</div>
    <div class="field-box${empty?' empty':highlight?' highlight':''}">${empty?'–':escaped}</div>
    ${!empty?`<button class="copy-btn" data-val="${value.replace(/"/g,'&quot;')}" onclick="copyText(this.dataset.val,this)">📋 Kopiera</button>`:''}
  </div>`;
}

function buildSession(item, idx) {
  const full = [
    'TITEL: '+item.titel,
    'EVENEMANGSDAGAR: '+item.tid,
    'ARRANGÖRER: '+COMMON.arrangorer,
    'EVENEMANGSKATEGORI: '+COMMON.kategori,
    'TYP AV EVENEMANG: '+COMMON.typ,
    'ÄMNESOMRÅDE 1: '+item.amne1,
    'ÄMNESOMRÅDE 2: '+item.amne2,
    'SPRÅK: '+COMMON.sprak,
    'PLATS: '+COMMON.plats,
    'NAMN PÅ PLATSEN/ARENAN: '+COMMON.arenanamn,
    '',
    'BESKRIVNING AV SAMHÄLLSFRÅGAN:',
    item.kortbeskrivning,
    '',
    'UTÖKAD INFORMATION OM EVENEMANGET:',
    item.utokad,
    '',
    'MEDVERKANDE:',
    item.medverkande,
    '',
    'KONTAKTPERSON 1: '+COMMON.kontakt1,
    'KONTAKTPERSON 2: '+COMMON.kontakt2,
    '',
    'TILLGÄNGLIGHET: '+COMMON.tillganglighet.replace(/\n/g,', '),
    'FÖRTÄRING: '+COMMON.fortaring,
    '',
    'WEBBLÄNK 1: '+COMMON.web1,
    'WEBBLÄNK 2: '+COMMON.web2,
    'LINKEDIN: '+COMMON.linkedin,
    'FACEBOOK: '+COMMON.facebook,
  ].join('\n');

  return `<div class="session" id="s${idx}">
    <div class="session-header" onclick="toggle(${idx})">
      <div class="time-chip">${item.tid.split(' ')[1]}</div>
      <div class="session-meta">
        <div class="session-topic">${item.amne1} · ${item.amne2}</div>
        <div class="session-title">${item.titel}</div>
      </div>
      <div class="toggle-icon">▾</div>
    </div>
    <div class="session-body">
      <div class="section-divider">📋 Grunduppgifter</div>
      ${field('Titel på evenemanget', item.titel)}
      <div class="fields-grid">
        ${field('Evenemangsdagar & tid', item.tid)}
        ${field('Arrangörer', COMMON.arrangorer)}
      </div>
      <div class="fields-grid">
        ${field('Evenemangskategori', COMMON.kategori)}
        ${field('Typ av evenemang', COMMON.typ)}
      </div>
      <div class="fields-grid">
        ${field('Ämnesområde 1', item.amne1)}
        ${field('Ämnesområde 2', item.amne2)}
      </div>
      <div class="fields-grid">
        ${field('Språk', COMMON.sprak)}
        ${field('Förtäring', COMMON.fortaring)}
      </div>
      <div class="fields-grid">
        ${field('Plats (adress)', COMMON.plats)}
        ${field('Namn på platsen/arenan', COMMON.arenanamn)}
      </div>

      <div class="section-divider">✍️ Beskrivningar – unika per session</div>
      ${field('Beskrivning av samhällsfrågan (kort)', item.kortbeskrivning, true)}
      ${field('Utökad information om evenemanget', item.utokad, true)}

      <div class="section-divider">👥 Medverkande – unikt per session</div>
      ${field('Medverkande', item.medverkande, true)}

      <div class="section-divider">📞 Kontaktpersoner</div>
      ${field('Kontaktperson 1', COMMON.kontakt1)}
      ${field('Kontaktperson 2', COMMON.kontakt2)}

      <div class="section-divider">♿ Tillgänglighet</div>
      ${field('Tillgänglighet', COMMON.tillganglighet)}

      <div class="section-divider">🔗 Webblänkar & sociala medier</div>
      <div class="fields-grid">
        ${field('Webblänk 1', COMMON.web1)}
        ${field('Webblänk 2', COMMON.web2)}
      </div>
      <div class="fields-grid">
        ${field('LinkedIn', COMMON.linkedin)}
        ${field('Facebook', COMMON.facebook)}
      </div>

      <button class="copy-session-btn" data-val="${full.replace(/"/g,'&quot;')}" onclick="copyText(this.dataset.val,this)">📋 Kopiera hela sessionen som text</button>
    </div>
  </div>`;
}

function toggle(idx) { document.getElementById('s'+idx).classList.toggle('open'); }

let idx=0;
const c=document.getElementById('sessions-container');
sessions.forEach(day=>{
  let h=`<div class="day-block"><div class="day-label">${day.day}<span>${day.date}</span></div>`;
  day.items.forEach(item=>{ h+=buildSession(item,idx++); });
  h+='</div>';
  c.innerHTML+=h;
});

function copyAll(){
  let all='ALMEDALSVECKAN 2026 – ALLA PROGRAMPUNKTER\n==========================================\n\n';
  sessions.forEach(day=>{
    all+='\n== '+day.day.toUpperCase()+' ==\n\n';
    day.items.forEach(item=>{
      all+='TITEL: '+item.titel+'\n';
      all+='TID: '+item.tid+'\n';
      all+='ÄMNE: '+item.amne1+' / '+item.amne2+'\n';
      all+='BESKRIVNING: '+item.kortbeskrivning+'\n';
      all+='UTÖKAD: '+item.utokad+'\n';
      all+='MEDVERKANDE: '+item.medverkande+'\n\n';
    });
  });
  const btn=document.querySelector('.copy-all-btn');
  navigator.clipboard.writeText(all).then(()=>{
    btn.textContent='✓ Kopierat!';
    setTimeout(()=>btn.textContent='📋 Kopiera alla som text',2500);
  });
}
</script>
</body>
